<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopLite | Giỏ hàng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="logo" href="index.html">ShopLite</a>

        <form class="search-form">
          <label class="sr-only" for="search">Tìm kiếm sản phẩm</label>
          <input
            id="search"
            name="search"
            type="search"
            placeholder="Tìm kiếm sản phẩm..."
          />
          <button type="submit">Tìm kiếm</button>
        </form>

        <a class="cart-link" href="cart.html"
          >Giỏ hàng <span class="cart-badge">0</span></a
        >
      </div>
    </header>

    <main class="container cart-page">
      <h1>Giỏ hàng</h1>

      <div class="cart-layout">
        <section class="cart-list" aria-labelledby="cart-items-heading">
          <h2 id="cart-items-heading" class="sr-only">
            Sản phẩm trong giỏ hàng
          </h2>

          <div id="cart-items"></div>
        </section>

        <aside
          class="order-summary"
          id="order-summary"
          aria-labelledby="order-summary-heading"
        ></aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 ShopLite</p>

        <nav aria-label="Liên kết cuối trang">
          <a href="#">Giới thiệu</a>
          <a href="#">Liên hệ</a>
          <a href="#">Chính sách đổi trả</a>
        </nav>
      </div>
    </footer>
    <script type="module" src="./js/cart-page.js"></script>
  </body>
</html>
