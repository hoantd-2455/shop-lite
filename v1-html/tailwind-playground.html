<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-slate-100 p-6 font-sans text-slate-800">
    <main class="mx-auto max-w-5xl">
      <h1 class="mb-6 text-3xl font-bold">So sánh Product Card</h1>

      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <article
          class="flex flex-col rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-1 hover:shadow-lg"
        >
          <img
            class="aspect-[3/2] w-full rounded-lg object-cover"
            src="https://placehold.co/600x400?text=AirSound"
            alt="Tai nghe không dây AirSound"
          />

          <h2 class="mt-4 text-lg font-bold">Tai nghe không dây AirSound</h2>

          <p class="mt-2 text-slate-500">
            Tai nghe nhỏ gọn, pin dùng đến 24 giờ.
          </p>

          <p class="my-4 font-bold text-blue-600">1.200.000 ₫</p>

          <button
            class="mt-auto rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white transition hover:bg-blue-700 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-blue-600"
            type="button"
          >
            Thêm vào giỏ
          </button>
        </article>
      </div>
    </main>
  </body>
</html>
